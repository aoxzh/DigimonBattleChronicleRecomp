name: android-apk
on:
  push:
    paths: ["port/android/**", "port/hal/**", "port/recomp/**"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Gradle wrapper (bootstrapped)
        working-directory: port/android
        run: |
          gradle wrapper --gradle-version 8.7 || true
          chmod +x gradlew

      - name: Build debug APK
        working-directory: port/android
        run: ./gradlew :app:assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: digimon-bc-debug-apk
          path: port/android/app/build/outputs/apk/debug/app-debug.apk
